<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quest in the Bay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./rosebud-game-defaults.css" />
    <script src="./rosebud-game-defaults.js" defer></script>
    <script type="importmap">
      {
        "imports": {}
      }
    </script>
    <style>
      html, body, #game-container { width: 100%; height: 100%; margin: 0; padding: 0; background: #302538; overflow: hidden; }
      body { touch-action: none; font-family: 'Press Start 2P', monospace; }
      #game-container {
        background: url(assets/image-13.png) center / cover no-repeat;
        image-rendering: pixelated;
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }
      .card {
        background: linear-gradient(145deg, #fffaf0, #fff3e4); border: 6px solid #795762;
        box-shadow: 8px 8px 0 rgba(84, 55, 65, .55), 0 16px 38px rgba(52, 41, 54, .22);
        border-radius: 6px; padding: 36px 40px; max-width: 900px; width: 80%; text-align: center; color: #68495a;
        animation: pop .4s steps(4);
      }
      @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      h1 { font-size: 22px; line-height: 1.7; margin: 0 0 12px; }
      .intro-photo {
        display: block;
        width: 170px;
        max-width: 35%;
        height: auto;
        object-fit: cover;
        border: 4px solid #795762;
        border-radius: 6px;
        margin: 0 auto 12px;
        image-rendering: auto;
      }
      .intro-scroll { display: block; width: 68px; height: 68px; object-fit: contain; image-rendering: pixelated; margin: 0 auto 6px; }
      .mushroom-icon { display: inline-block; width: 64px; height: 64px; object-fit: contain; vertical-align: middle; image-rendering: pixelated; }
      p { font-size: 12px; line-height: 1.8; margin: 0 0 24px; color: #9a6f78; }
      .row { display: flex; gap: 24px; justify-content: center; align-items: center; flex-wrap: wrap; min-height: 120px; }
      button {
        font-family: inherit; cursor: pointer; border: 4px solid #795762;
        box-shadow: 4px 4px 0 rgba(84, 55, 65, .52); border-radius: 4px;
        padding: 14px 22px; font-size: 14px; color: #68495a; transition: transform .1s, box-shadow .1s;
      }
      button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 rgba(84, 55, 65, .5); }
      button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 rgba(84, 55, 65, .52); }
      .yes { background: #b9d7b5; }
      .no { background: #efb9ad; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .opt { background: #f4dcae; font-size: 11px; line-height: 1.6; padding: 16px 10px; }
      .opt span { display: block; font-size: 32px; margin-bottom: 8px; }
      .outing-image { display: block; width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated; margin: 0 auto; }
      .outing-image.tarot-image { width: 36px; height: 36px; }
      .itinerary-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
      .itinerary-image { width: 48px; height: 42px; object-fit: contain; image-rendering: pixelated; }
      .card.itinerary-screen { box-sizing: border-box; width: min(92%, 980px); max-width: 980px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 26px 30px; }
      .story-map { position: relative; isolation: isolate; min-height: 210px; margin: 18px 0 16px; padding: 18px; overflow: hidden; border: 4px solid #668b80; border-radius: 8px; background: #cce4dc; box-shadow: inset 0 0 0 2px rgba(255, 250, 230, .65); }
      .story-map-art { position: absolute; z-index: -1; inset: 0; width: 100%; height: 100%; }
      .map-shore { fill: #e6e9c7; }
      .map-shore-south { fill: #e9e8c9; }
      .map-contour { fill: none; stroke: #a9c7a9; stroke-width: 3; opacity: .72; }
      .map-bridge { fill: none; stroke: #a76f69; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .62; }
      .map-boat { fill: #fff6df; stroke: #769a90; stroke-width: 3; stroke-linejoin: round; opacity: .9; }
      .map-label { fill: #64857b; font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 1px; opacity: .78; }
      .map-route-halo { fill: none; stroke: #fff3cf; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
      .map-route { fill: none; stroke: #669c91; stroke-width: 4; stroke-dasharray: 8 8; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
      .map-stop-marker { fill: #fff9e8; stroke: #669c91; stroke-width: 5; }
      .story-stops { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 16px; }
      .story-stop { position: relative; display: flex; align-items: center; gap: 9px; min-width: 0; min-height: 88px; box-sizing: border-box; padding: 16px 10px 10px; border: 3px solid #795762; border-radius: 5px; background: rgba(255, 250, 240, .96); box-shadow: 4px 4px 0 rgba(68, 80, 72, .28); text-align: left; color: #68495a; }
      .story-stop-number { position: absolute; top: -11px; left: -9px; display: grid; place-items: center; width: 25px; height: 25px; border: 2px solid #fff8ec; border-radius: 50%; background: #efb9ad; box-shadow: 2px 2px 0 rgba(84, 55, 65, .4); color: #68495a; font-size: 8px; z-index: 1; }
      .story-stop-image { flex: 0 0 auto; width: 42px; height: 42px; object-fit: contain; image-rendering: pixelated; }
      .story-stop-icon { flex: 0 0 auto; font-size: 24px; }
      .story-stop-copy { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
      .story-waypoint { color: #66877a; font-size: 7px; line-height: 1.5; text-transform: uppercase; }
      .story-stop-name { font-size: 9px; line-height: 1.6; overflow-wrap: anywhere; }
      .story-map-note { margin-bottom: 18px; }
      .opt.sel { background: #d9c9df; }
      #mute { position: absolute; top: 16px; right: 16px; font-size: 12px; background: #fff8ec; }
      .confetti { position: absolute; width: 10px; height: 10px; pointer-events: none; top: -20px; }
      .petal-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 5;
      }
      .pixel-petal {
        position: absolute;
        top: -24px;
        width: 10px;
        height: 10px;
        background: #f6b4cf;
        box-shadow:
          5px 0 0 #fbd3e4,
          0 5px 0 #fbd3e4,
          5px 5px 0 #f29abf;
        image-rendering: pixelated;
        opacity: 0.82;
        transform-origin: center;
        animation: petal-fall linear forwards;
      }
      @keyframes petal-fall {
        0% { transform: translate3d(0, -8vh, 0) rotate(0deg); }
        50% { transform: translate3d(calc(var(--drift) * 0.55), 52vh, 0) rotate(180deg); }
        100% { transform: translate3d(var(--drift), 110vh, 0) rotate(360deg); }
      }
      @media (max-width: 760px) {
        .card.itinerary-screen { width: calc(100% - 28px); padding: 20px 16px; }
        .story-stops { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 480px) {
        .card.itinerary-screen { padding: 16px 12px; }
        .story-stops { grid-template-columns: 1fr; gap: 16px; }
      }
    </style>
  
</head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="main.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ChatManager.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ProgressLogger.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/OGP.js"></script>
  
</body>
</html>
